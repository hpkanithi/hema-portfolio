<svg width="680" height="490" viewBox="0 0 680 490" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Slack-style job queue architecture</title>
<desc>A VPC containing an ALB, ECS web service, ECS worker service, and ElastiCache Redis, with an SQS queue and dead-letter queue outside the VPC handling message durability and a CloudWatch alarm on DLQ depth.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="490" fill="#ffffff"/>

<!-- legend -->
<rect x="430" y="45" width="10" height="10" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<text x="445" y="54" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Normal flow</text>
<rect x="540" y="45" width="10" height="10" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
<text x="555" y="54" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Failure path</text>

<!-- VPC outer container -->
<rect x="90" y="70" width="550" height="170" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.5"/>
<text x="110" y="100" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">VPC &#183; us-east-2</text>
<text x="110" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">10.0.0.0/16 &#183; 2 AZs</text>

<!-- Internet external input -->
<text x="45" y="155" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Internet</text>
<line x1="45" y1="168" x2="106" y2="168" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- Inner boxes: ALB, ECS web, ECS worker, Redis -->
<g>
<rect x="110" y="130" width="115" height="70" rx="12" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<text x="167" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">ALB</text>
<text x="167" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e40af">Load balancer</text>
</g>
<g>
<rect x="240" y="130" width="115" height="70" rx="12" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<text x="297" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">ECS web</text>
<text x="297" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e40af">2 tasks</text>
</g>
<g>
<rect x="370" y="130" width="115" height="70" rx="12" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<text x="427" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">ECS worker</text>
<text x="427" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e40af">1 task</text>
</g>
<g>
<rect x="500" y="130" width="115" height="70" rx="12" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<text x="557" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">Redis</text>
<text x="557" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e40af">Cache/results</text>
</g>

<!-- arrows inside VPC -->
<line x1="225" y1="165" x2="238" y2="165" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="485" y1="165" x2="498" y2="165" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- SQS queue (outside VPC, durable buffer) -->
<g>
<rect x="245" y="280" width="150" height="70" rx="12" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<text x="320" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">SQS queue</text>
<text x="320" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e40af">Durable buffer</text>
</g>

<!-- SQS DLQ -->
<g>
<rect x="430" y="280" width="150" height="70" rx="12" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
<text x="505" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#7f1d1d">SQS DLQ</text>
<text x="505" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#991b1b">After 3 retries</text>
</g>

<!-- CloudWatch alarm -->
<g>
<rect x="430" y="380" width="150" height="70" rx="12" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
<text x="505" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#7f1d1d">DLQ alarm</text>
<text x="505" y="428" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#991b1b">CloudWatch metric</text>
</g>

<!-- connecting arrows crossing VPC boundary -->
<path d="M297,200 L297,278" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M360,280 L427,202" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="395" y1="315" x2="428" y2="315" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="505" y1="350" x2="505" y2="378" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
